<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HY Events</title>
<meta property="og:title" content="HY Team Event">
<meta property="og:description" content="Agenda, roles and details for our Friday Night Hangouts and team nights.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HY Team">
<meta property="og:url" content="https://team.unityhyventures.com/">
<meta property="og:image" content="https://team.unityhyventures.com/images/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="images/icon.png">
<link rel="apple-touch-icon" href="images/icon.png">
<meta name="theme-color" content="#1B2A44" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B2A44" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* HY Events (team.unityhyventures.com). Redesigned 2026-11-16 after luma.com (Johnny: "I hate the
   current event page", study Luma's home, calendars, event page and manage page). An Events home
   (Upcoming / Past on a date timeline), Calendars (team nights, product expos, trips, workshops), a
   public page per event, and a Manage view for whoever is signed in with the ··· admin login.
   The agendas live in data/team-events.json, read and saved through the API; flyers in
   data/team-flyers.json. Light or dark follows the phone. Glow guest pages on
   healthcare.unityhyventures.com are only linked from here, never changed (Johnny, 2026-11-16). */
:root{
  --bg:#F4F5F6; --card:#FFFFFF; --card-2:#F7F8F9; --line:rgba(19,21,23,.09); --line-2:rgba(19,21,23,.16);
  --ink:#131517; --ink-2:#3B3F44; --muted:#737980; --chip:#EBEDEF; --accent:#B08445; --accent-ink:#8A6230; --on-accent:#1B1408;
  --btn:#131517; --btn-ink:#FFFFFF; --glow:rgba(176,132,69,.16); --tl:#CDD1D6; --red:#B4372C; --red-bg:#FBEAE7; --amber:#8A5F10; --amber-bg:#FBF1DC;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.16);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131517; --card:#1C1E21; --card-2:#222428; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --ink:#F2F3F4; --ink-2:#C9CBCE; --muted:#8E9297; --chip:#2A2D31; --accent:#E2B36A; --accent-ink:#E2B36A; --on-accent:#1B1408;
  --btn:#F2F3F4; --btn-ink:#131517; --glow:rgba(226,179,106,.13); --tl:#3A3D42; --red:#F08A80; --red-bg:#2B1815; --amber:#E2B36A; --amber-bg:#2A2213;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;background:radial-gradient(1200px 420px at 50% -140px,var(--glow),transparent 70%),var(--bg)}
a{color:inherit;text-decoration:none} button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* top bar */
.top{display:flex;align-items:center;gap:20px;padding:14px max(18px,calc((100% - 1040px) / 2));font-size:14px;position:relative;z-index:5}
.top .logo{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.top .logo i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#6E8FD4);display:inline-block}
.top nav{display:flex;gap:16px}
.top nav a{color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap} .top nav a.on{color:var(--ink);font-weight:600}
.top nav a:hover{color:var(--ink)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:12px}
.dots{font-size:13px;padding:6px 12px;border-radius:8px;background:var(--chip);border:0;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.dots.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px 60px}
.wrap.wide{max-width:1040px}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 28px;gap:12px;flex-wrap:wrap}
.head .r{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg a{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg a.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.note{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:0 0 16px}
.empty{text-align:center;padding:46px 0;color:var(--muted)}
/* the timeline */
.tl{display:grid;grid-template-columns:118px 22px minmax(0,1fr)}
.tl .d{padding-top:16px} .tl .d b{display:block;font-size:15px;font-weight:600} .tl .d span{font-size:14px;color:var(--muted)}
.tl .rail{position:relative} .tl .rail:before{content:"";position:absolute;left:10px;top:0;bottom:0;border-left:1px dashed var(--tl)}
.tl .rail i{position:absolute;left:6px;top:23px;width:9px;height:9px;border-radius:50%;background:var(--tl)}
.tl .rail i.now{background:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.yr{grid-column:1 / -1;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 12px}
.ev{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 16px;margin:0 0 16px;transition:border-color .15s,transform .15s}
.ev:hover{border-color:var(--line-2);transform:translateY(-1px)}
.ev .meta{flex:1;min-width:0}
.ev .tm{font-size:14px;color:var(--muted)} .ev .tm b{color:var(--accent-ink);font-weight:600}
.ev h3{font-size:19px;font-weight:600;margin:4px 0 7px;letter-spacing:-.01em;line-height:1.3}
.ln{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);margin:3px 0;min-width:0}
.ln svg{flex:none;opacity:.8} .ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--ink-2)}
.chip.k{background:var(--glow);color:var(--accent-ink)}
.mbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:500;padding:6px 11px;border-radius:8px;background:var(--chip);border:0;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.mbtn:hover{color:var(--ink)} .mbtn.acc{background:var(--accent);color:var(--on-accent);font-weight:600}
.thumb{width:118px;height:118px;border-radius:10px;flex:none;overflow:hidden;background:var(--chip)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.gen{width:100%;height:100%;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;font-size:13px;line-height:1.15;letter-spacing:-.01em}
.ev.past{opacity:.82}
/* calendars */
.cals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.calc{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.calc:hover{border-color:var(--line-2)}
.calc .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;margin-bottom:14px}
.calc h3{margin:0 0 3px;font-size:17px} .calc p{margin:0;font-size:13.5px;color:var(--muted)}
.calc .nx{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.calc .nx b{display:block;font-weight:600;color:var(--ink);margin-top:2px}
.calhero{border-radius:16px;min-height:150px;margin-bottom:22px;display:flex;align-items:flex-end;padding:22px;color:#fff}
.calhero h1{color:#fff} .calhero p{margin:4px 0 0;opacity:.88;font-size:14px}
.h2{font-size:19px;font-weight:700;margin:6px 0 14px}
/* the event page */
.epage{display:grid;grid-template-columns:320px minmax(0,1fr);gap:40px;align-items:start}
.epage > div{min-width:0}
.cover{display:block;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--chip);box-shadow:var(--shadow);border:0;padding:0;cursor:zoom-in;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .gen{font-size:30px;padding:22px;cursor:default}
.cover.nofl{cursor:default}
.cover .see{position:absolute;right:10px;bottom:10px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff}
.mng{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:12px;background:var(--glow);color:var(--accent-ink);font-size:13.5px}
.side .lbl{font-size:13px;font-weight:600;color:var(--muted);padding:18px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.person{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;margin:8px 0}
.person small{color:var(--muted);font-weight:400;margin-left:auto;font-size:12.5px;text-align:right}
.person a:hover{text-decoration:underline}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.av.tbc{background:var(--chip);color:var(--muted)}
.ep h1{font-size:38px;line-height:1.1;margin:8px 0 20px}
.ep .sub{font-size:16px;color:var(--ink-2);margin:-10px 0 18px}
.row{display:flex;align-items:center;gap:14px;margin:14px 0}
.dtile{width:44px;border-radius:8px;border:1px solid var(--line-2);overflow:hidden;text-align:center;flex:none}
.dtile i{display:block;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 0;background:var(--chip);color:var(--muted)}
.dtile b{display:block;font-size:17px;line-height:24px}
.ibox{width:44px;height:44px;border-radius:8px;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.row .t1{font-size:15.5px;font-weight:600} .row .t2{font-size:13.5px;color:var(--muted);margin-top:1px}
.row .t2 a,.linkbtn{color:var(--accent-ink);font-weight:500}
.linkbtn{background:none;border:0;padding:0;font:inherit;cursor:pointer}
.box{margin-top:22px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.box .bh{font-size:13px;font-weight:600;color:var(--muted);padding:9px 14px;background:var(--card-2);border-bottom:1px solid var(--line)}
.box .bb{padding:14px}
.big{display:block;width:100%;text-align:center;padding:11px;border-radius:10px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:14.5px;border:0;cursor:pointer;font-family:inherit}
.big.sec{background:var(--chip);color:var(--ink);margin-top:8px}
.big:hover{opacity:.92}
.sech{font-size:13px;font-weight:600;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line);margin:30px 0 12px;display:flex;justify-content:space-between;gap:10px}
.sech span{font-weight:500}
.ovt{width:100%;border-collapse:collapse;font-size:14px}
.ovt th{text-align:right;font-size:11.5px;font-weight:600;color:var(--muted);padding:0 0 6px} .ovt th:first-child{text-align:left}
.ovt td{padding:8px 0;border-bottom:1px solid var(--line);text-align:right;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ovt td:first-child{text-align:left;color:var(--ink);font-weight:500;white-space:normal}
.ovt td + td{padding-left:12px}
.crew{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.crew div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.crew span{display:block;font-size:12px;color:var(--muted)} .crew b{display:block;margin-top:2px;font-size:14.5px;font-weight:600}
.crew b.tbc{color:var(--muted);font-weight:500} .crew i{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.glink{margin:10px 0 0;font-size:13.5px} .glink a{color:var(--accent-ink);font-weight:500}
.ag{list-style:none;margin:0;padding:0}
.ag > li{margin:0 0 18px}
.ag h3{font-size:15.5px;margin:0 0 6px;display:flex;justify-content:space-between;gap:10px}
.ag h3 span{font-size:12.5px;font-weight:500;color:var(--muted)}
.it{padding:7px 0;border-bottom:1px solid var(--line)}
.run{list-style:none;margin:0;padding:0}
.run li{padding:14px 0;border-bottom:1px solid var(--line)}
.run .rt{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.run .rh{margin:3px 0 0;font-size:15.5px;font-weight:600}
.run ul{margin:6px 0 0;padding-left:20px} .run ul li{padding:2px 0;border:0;font-size:14.5px}
.run ul li.gap{list-style:none;height:10px;padding:0}
.run .rs{margin:8px 0 0;font-size:13.5px;color:var(--ink-2)}
.it .ih{margin:0;font-size:14.5px} .it .iw{color:var(--ink-2)} .it .im{color:var(--muted);font-size:13px} .it .sep{color:var(--muted)}
.it ul{margin:4px 0 0;padding-left:20px;color:var(--ink-2);font-size:14px} .it ul ul{margin-top:2px}
ul.cal{list-style:none;padding:0;margin:0}
ul.cal li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
ul.cal .k{color:var(--muted)} ul.cal .cw{display:block} ul.cal .cd{display:block;color:var(--muted);font-size:13px}
.tzi{color:var(--muted);font-size:12.5px}
.flk{background:none;border:0;padding:0;font:inherit;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
/* manage */
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px;flex-wrap:wrap}
.mhead .crumb{font-size:13px;color:var(--muted)} .mhead .crumb a:hover{color:var(--ink)}
.mhead h1{font-size:28px;margin-top:4px}
.mtabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:18px 0 22px;font-size:15px;overflow-x:auto}
.mtabs a{padding:10px 0;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.mtabs a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qa button,.qa a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;font-size:15px;font-weight:600;text-align:left;color:var(--ink)}
.qa button:hover,.qa a:hover{border-color:var(--line-2)}
.qa i{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:16px;color:#fff;flex:none}
.mcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.prev{border-radius:10px;background:var(--card-2);border:1px solid var(--line);padding:12px;display:flex;gap:12px}
.prev .thumb{width:104px;height:104px}
.prev h4{margin:0 0 6px;font-size:16px;line-height:1.25} .prev p{margin:2px 0;font-size:12.5px;color:var(--muted)}
.plink{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.plink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ww h3{margin:2px 0 8px;font-size:17px}
.btn2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn2 .mbtn{flex:1;justify-content:center;padding:9px}
.list{border:1px solid var(--line);border-radius:14px;background:var(--card)}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.list .li:last-child{border-bottom:0} .list .li small{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right}
.list .li a{color:var(--accent-ink);font-weight:500}
.mnote{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.foot{margin-top:46px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
.foot p{margin:6px 0 0} .ver{font-size:12px} .ver.old{color:var(--amber)}
/* admin editor (unchanged behaviour, new look) */
.dtop{display:flex;align-items:center;gap:8px;margin:6px 0 10px} .dtop .sp{flex:1}
.stat{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
.dsub{color:var(--ink-2);margin:6px 0 0}
.ed h2,#doc > h2{font-size:17px;margin:26px 0 10px}
.btn{background:var(--card);border:1px solid var(--line-2);color:var(--ink);border-radius:9px;font:inherit;font-size:14px;font-weight:600;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.warn{color:var(--red);border-color:var(--red-bg)}
.btn.warn.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{font-size:12.5px;padding:4px 9px}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fl{display:block;min-width:0} .fl.full{grid-column:1/-1}
.fl > span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 3px}
.fl > span i{font-style:normal;font-weight:400;color:var(--muted)}
.ed input,.ed textarea{width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:9px;color:var(--ink);font:inherit;font-size:15px;padding:8px 10px;line-height:1.45}
.ed textarea{resize:vertical;min-height:62px}
.ed input:focus,.ed textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.ed input.bad{border-color:var(--red)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.sece{border:1px solid var(--line-2);border-radius:14px;padding:12px;margin:0 0 12px;background:var(--card)}
.seh{display:flex;align-items:center;gap:6px;margin-bottom:10px} .seh b{font-size:15.5px;margin-right:auto}
.iteme{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:var(--card-2)}
.sh{display:flex;align-items:center;gap:6px;margin-bottom:8px} .sh b{font-size:13.5px;color:var(--ink-2);margin-right:auto}
.iteme .grid2{grid-template-columns:2fr 1fr}
.adds{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.edbar{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border-top:1px solid var(--line);margin:22px 0 0;padding:12px 0}
.edbar .st{flex:1 1 220px;font-size:14px;font-weight:600;color:var(--ink-2);min-width:0}
.edbar .st.err{color:var(--red)} .edbar .st .btn{margin:6px 6px 0 0}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.tc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:14px;font:inherit;color:var(--ink);cursor:pointer}
.tc:hover{border-color:var(--accent);background:var(--glow)}
.tc b{font-size:16px;line-height:1.3} .tc span{font-size:12.5px;font-weight:700;color:var(--accent-ink)} .tc i{font-style:normal;font-size:13px;color:var(--muted);line-height:1.35}
.tc.blank{justify-content:center;align-items:center;color:var(--muted);font-weight:700;border-style:dashed}
/* toasts, dialogs, the image viewer, the update bar */

const API = "https://health-intake-api.vercel.app/api/save-functions?doc=team-events";

const ZOOM_DEFAULT = "515-333-3193";
const FNH_FLOW = [["7:10 to 7:30 PM", "Networking"], ["7:30 to 9:00 PM", "All partners"], ["9:00 to 9:30 PM", "Hangout"]];

  ["Existing partners", ["Name · City · Background · What you did this week (2 MG1 / 20+ PV retail) · Goal"]]
]};

/* ---------------- the agenda's shape ----------------
   Johnny, 2026-10-14: an FNH agenda is the event's details, the roles, then the agenda in five
   sections: Introduction & Recognition, Calendar, Volume & Product Education, Personal Growth and
   Leadership Training. Every item in every section has the same parts: a topic, a speaker (one
   person, or a panel and the person who leads it), the minutes, and bullet points. The calendar's
   item lists events instead. All 54 items of the eight agendas from Feb 27 to Oct 16 fit this.
   Data: agenda = [{ k, items: [{ t, who, by, min, pts, cal }] }], sections in the event's order. */
/* Roles: who hosts (two slots), who is the online CEO (Chief Energy Officer) and who runs tech.
   Johnny, 2026-10-15: people need to know who is doing what, so on an FNH all four always show,
   "To be confirmed" until someone is named. Anything else (a DJ, a timer) goes under other roles.
   Stored as rows [role, person]; older labels ("Host / Co-host", "DJ & Technology") still map. */
const STD_ROLES = [["host", "Host"], ["cohost", "Co-host"], ["ceo", "Online CEO (Chief Energy Officer)"], ["tech", "Tech"]];
function roleKey(label){
  const l = String(label || "").toLowerCase();
  if(/^co-?host/.test(l)) return "cohost";
  if(/^host/.test(l)) return "host";
  if(/ceo|energy officer/.test(l)) return "ceo";
  if(/^tech|technology/.test(l)) return "tech";
  return "";
}
function roleSlots(e){
  const std = {}, extra = [];
  (e.roles || []).forEach(function(r){
    if(!r || !(r[0] || r[1])) return;
    const k = roleKey(r[0]);
    if(k && !std[k]) std[k] = r[1] || ""; else if(r[1] || r[0]) extra.push([r[0] || "", r[1] || ""]);
  });
  return { std: std, extra: extra };
}
function isFNH(e){ return !e.kind || /fnh|friday/i.test(e.kind); }
/* A conference call (Johnny, 2026-11-22, after Leann's Chinese-market New IBO orientation): not an FNH.
   No sections, no overview table, no dress guide. One run of show where every talk has its clock
   time, a title, the questions it answers, and the speaker with their minutes. The host keeps time,
   and each speaker introduces the next one. Any Orientation or "Conference call" kind is one (the
   save API keeps only known fields, so this rides on kind). */
function isCall(e){ return /orientation|conference call/i.test(e.kind || ""); }
/* Johnny's Nov 22 agenda: one minute between talks for the handoff (9:00–9:04, 9:05–9:10 …).
   Minutes are the talk's own length; the handoff minute comes on top. */
const HANDOFF = 1;
function isBreak(p){ return typeof p === "string" && /^\s*-{2,}\s*$/.test(p); }
function callRows(e){
  const m = TIME_RE.exec(e.time || ""); let t = m ? tmin(m[1], m[2], m[3] || m[6]) : null;
  const rows = [];
  sectionsOf(e).forEach(function(x){ x.items.forEach(function(it){
    const n = itemMin(it), r = { it: it, min: n, at: "" };
    if(t != null && n){
      if(rows.some(function(q){ return q.min; })) t += HANDOFF;
      const a = tfmt(t, true), b = tfmt(t + n, true);
      r.at = a.t + (a.ap === b.ap ? "" : " " + a.ap) + "–" + b.t + " " + b.ap; t += n;

    rows.push(r);

  const rows = callRows(e);
  if(!rows.length) return '<p class="empty" style="padding:16px 0">The agenda is coming.</p>';
  return '<ol class="run">' + rows.map(function(r){
    const sp = speakerText(r.it);
    return '<li>' + (r.at ? '<div class="rt">' + esc(r.at) + '</div>' : '')
      + (r.it.t ? '<p class="rh">' + esc(r.it.t) + '</p>' : '')

      + (sp ? '<p class="rs">🎙 ' + esc([sp, r.min ? fmtMin(r.min) + " min" : ""].filter(Boolean).join(" · ")) + '</p>' : '')
      + '</li>';

}
function callText(e){
  const L = [];
  L.push("*【" + e.title.toUpperCase() + "】*");
  if(e.sub) L.push(e.sub);
  L.push("");
  L.push("📅 " + whenLong(e) + (e.time ? ", " + e.time : ""));

  if(e.zoom) L.push("💻 Zoom " + e.zoom + (e.pass ? ", passcode " + e.pass : "") + ": https://zoom.us/j/" + e.zoom.replace(/\D/g, ""));

  /* Johnny's own edit of the copy (2026-11-22): the speaker and minutes sit right after the bold
     title on the same line ("*9:05–9:12 PM  Topic* 🎙 Johnny · 5 min"); a talk with no speaker (the

  callRows(e).forEach(function(r){

    L.push("*" + [r.at, r.it.t].filter(Boolean).join("  ") + "*"

  });

}

        { k: "growth", items: [{ t: "Getting the most out of books, audios and events", min: 7 }, { t: "PHP and working with your upline", min: 8 }] },
        { k: "volume", items: [{ t: "Volume: from 100% personal use to your first customer", min: 10 }] },

function monthName(d){ return asDate(d).toLocaleDateString("en-US", { month: "long" }); }

const OLDK = { intro: "intro", calendar: "calendar", product: "volume", retail: "volume", growth: "growth",

function sectionsOf(e){
  const a = Array.isArray(e.agenda) ? e.agenda : [];

function monthYear(d){ return asDate(d).toLocaleDateString("en-US", { month: "long", year: "numeric" }); }
function whenLong(e){ return tba(e) ? monthYear(e.date) : longDate(e.date); }
function ymd(t){ return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); }

function toast(t){ const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(el._h); el._h = setTimeout(function(){ el.hidden = true; }, 3200); }

/* The event to open with: the next one coming (today counts), else the most recent. */
function defaultEvent(){
  const t = todayET();
  const ahead = EVENTS.filter(function(e){ return e.date >= t; }).sort(function(a, b){ return -byDateDesc(a, b); });
  return ahead[0] || EVENTS.slice().sort(byDateDesc)[0] || null;
}
/* Pages (2026-11-16, after Luma): #  the events, upcoming · #past · #calendars · #cal/<id> one calendar

   #<event id>/manage/<tab> the host's view, after the ··· admin login. */
function wantedId(){ return decodeURIComponent(location.hash.slice(1)); }
function route(){
  const h = wantedId(), p = h.split("/");

}

}

  const t = todayET(), d = defaultEvent();
  if(e.date === t) return ["Tonight", ""];
  if(e.date > t) return [e === d ? "Next up" : "Coming up", ""];
  return [e === d ? "Most recent" : "Past event", "past"];
}

/* ---------------- loading ---------------- */
function setData(d){
  EVENTS = (d.events || []).slice().sort(byDateDesc); SAVED_AT = d.savedAt || null; LOADED = true; LOAD_FAILED = false; KEPT_AT = 0;
  try { localStorage.setItem(KEEP, JSON.stringify({ savedAt: SAVED_AT, events: EVENTS, keptAt: Date.now() })); } catch(e){}
}
function getJSON(u){
  return fetch(u + (u.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ return d && Array.isArray(d.events) ? d : null; })
    .catch(function(){ return null; });
}
function loadData(){
  return getJSON(API).then(function(d){ return d || getJSON("data/team-events.json"); }).then(function(d){
    if(d){
      const changed = !LOADED || KEPT_AT || d.savedAt !== SAVED_AT;
      setData(d);
      if(changed){ if(EDIT || STOP) renderNav(); else render(); }
      return;
    }
    if(LOADED) return;
    let kept = null; try { kept = JSON.parse(localStorage.getItem(KEEP) || "null"); } catch(e){}
    if(kept && Array.isArray(kept.events)){ EVENTS = kept.events; SAVED_AT = kept.savedAt; LOADED = true; KEPT_AT = kept.keptAt || 1; }

/* ---------------- time zones ----------------
   Times are typed in Eastern. Johnny, 2026-10-15: show Central and Pacific next to every time.
   US Eastern, Central and Pacific change clocks on the same days, so CT is always ET minus one
   hour and PT minus three. A time already marked with another zone (Beijing, PT…) is left alone. */
const ZONES = [["CT", -1], ["PT", -3]];
const TIME_RE = /(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?(?:\s*(?:to|–|-)\s*(\d{1,2})(?::(\d{2}))?)?\s*(AM|PM)/i;
function tmin(h, m, ap){ return (+h % 12 + (/pm/i.test(ap) ? 12 : 0)) * 60 + (+m || 0); }
function tfmt(min, withMin){
  min = ((min % 1440) + 1440) % 1440;
  const h = Math.floor(min / 60), m = min % 60;
  return { t: (h % 12 || 12) + (withMin || m ? ":" + String(m).padStart(2, "0") : ""), ap: h < 12 ? "AM" : "PM" };
}
function etOnly(s){ return !/\b(CT|PT|MT|CST|PST|CDT|PDT|BJT|GMT|UTC)\b|beijing|北京/i.test(s); }
/* "7:30 to 9:00 PM" or "9 PM", moved by `hours`, in the same style; "" if there is no time. */
function shiftTime(s, hours, startOnly){
  const m = TIME_RE.exec(s); if(!m) return "";
  const ap2 = m[6], ap1 = m[3] || ap2;
  const a = tfmt(tmin(m[1], m[2], m[4] != null ? ap1 : ap2) + hours * 60, m[2] != null);
  if(m[4] == null || startOnly) return a.t + " " + a.ap;
  const b = tfmt(tmin(m[4], m[5], ap2) + hours * 60, m[5] != null);
  return a.ap === b.ap ? a.t + " to " + b.t + " " + b.ap : a.t + " " + a.ap + " to " + b.t + " " + b.ap;
}
function otherZones(s, startOnly){
  if(!s || !etOnly(s) || !TIME_RE.test(s)) return "";
  return ZONES.map(function(z){ return shiftTime(s, z[1], startOnly) + " " + z[0]; }).join(" · ");
}
/* "7:10 to 7:30 PM" moved by `hours`, written short: "6:10–6:30 PM". */
function shortRange(s, hours){
  const m = TIME_RE.exec(s); if(!m) return "";
  const ap2 = m[6], ap1 = m[3] || ap2;
  const a = tfmt(tmin(m[1], m[2], m[4] != null ? ap1 : ap2) + hours * 60, m[2] != null);
  if(m[4] == null) return a.t + " " + a.ap;
  const b = tfmt(tmin(m[4], m[5], ap2) + hours * 60, m[5] != null);
  return a.t + (a.ap === b.ap ? "" : " " + a.ap) + "–" + b.t + " " + b.ap;
}
/* The night's run of show as a table: what, then the time in ET, CT and PT. A row whose time isn't
   an Eastern clock time is shown as typed, across the three columns. */
function overviewHTML(flow){
  return '<table class="ovt"><thead><tr><th></th><th>ET</th><th>CT</th><th>PT</th></tr></thead><tbody>'
    + flow.map(function(f){
        const ok = TIME_RE.test(f[0]) && etOnly(f[0]);
        return '<tr><td>' + esc(f[1]) + '</td>' + (ok
          ? '<td>' + esc(shortRange(f[0], 0)) + '</td>' + ZONES.map(function(z){ return '<td>' + esc(shortRange(f[0], z[1])) + '</td>'; }).join("")
          : '<td colspan="3">' + esc(f[0]) + '</td>') + '</tr>';
      }).join("") + '</tbody></table>';
}
/* A calendar entry's details line: every "… ET" time is followed by its CT and PT, all · separated. */
function detailsText(d){
  return String(d || "").replace(/(\d{1,2}(?::\d{2})?\s*(?:AM|PM)?\s*(?:to|–|-)\s*)?\d{1,2}(?::\d{2})?\s*(?:AM|PM)\s*ET\b/gi, function(t){
    return t + " · " + otherZones(t.replace(/\s*ET$/i, ""));

}
/* Calendar entries (Johnny, 2026-10-15: the run-on lines felt messy): the date once, the name of the
   event, and a lighter line under it for time, host and place. Rows are [date, what, details];
   older two-part rows show as they were. */
function calHTML(cal){

    const same = c[0] === last; last = c[0];
    const what = c[2] !== undefined ? esc(c[1]) : withZones(c[1]), f = flyerFor(c[1]);
    return '<li><span class="k">' + (same ? '' : esc(c[0])) + '</span><span><span class="cw">'
      + (f ? '<button type="button" class="flk" data-flyer="' + esc(f.id) + '" title="See the flyer">' + what + '</button>' : what) + '</span>'
      + (c[2] ? '<span class="cd">' + esc(detailsText(c[2])) + '</span>' : '') + '</span></li>';

/* In free text (calendar rows), every "… ET" time gets its CT and PT after it. */

  return esc(text).replace(/(\d{1,2}(?::\d{2})?\s*(?:AM|PM)?\s*(?:to|–|-)\s*)?\d{1,2}(?::\d{2})?\s*(?:AM|PM)\s*ET\b/gi, function(t){
    return t + ' <span class="tzi">(' + otherZones(t.replace(/\s*ET$/i, "")) + ')</span>';

/* ---------------- copy as text ----------------
   Johnny, 2026-10-15: a button that copies the agenda so people can paste it into WhatsApp or a
   text, clean but organized. WhatsApp shows *this* as bold; the emoji lead-ins follow the HY agenda
   of Feb 27 in Notion. Ends with the link to this event. */
function zonesPlain(text){
  return String(text).replace(/(\d{1,2}(?::\d{2})?\s*(?:AM|PM)?\s*(?:to|–|-)\s*)?\d{1,2}(?::\d{2})?\s*(?:AM|PM)\s*ET\b/gi, function(t){
    return t + " (" + otherZones(t.replace(/\s*ET$/i, "")) + ")";

function agendaText(e){

  L.push("");

  if(e.where) L.push("📍 " + e.where + (e.whereNote ? " (" + e.whereNote + ")" : ""));
  if(e.signup) L.push("📝 Sign up: " + e.signup);

  if(e.zoom) L.push("💻 Zoom " + e.zoom + (e.pass ? ", passcode " + e.pass : "") + ": https://zoom.us/j/" + e.zoom.replace(/\D/g, ""));
  if(e.dress) L.push("👔 " + e.dress + " (guide: " + DRESS_URL() + ")");
  if(e.flow && e.flow.length){
    L.push("", "*Overview*");
    e.flow.forEach(function(f){ L.push(f[0] + (otherZones(f[0]) && !/\bET\b/.test(f[0]) ? " ET" : "") + " · " + f[1]); });
  }

  if(roles.length){
    L.push("", "*Roles*");

  }
  if(secs.length){
    const total = secs.reduce(function(n, x){ return n + minsOf(x.items); }, 0);
    L.push("", "*" + (e.agendaTitle || "Agenda").toUpperCase() + "*" + (total ? " (" + fmtMin(total) + " min)" : ""));
    secs.forEach(function(x){
      const m = minsOf(x.items);
      L.push("", "*" + SEC[x.k].name + "*" + (m ? " · " + fmtMin(m) + " min" : ""));
      x.items.forEach(function(it){
        const sp = speakerText(it), head = [it.t, sp, itemMin(it) && (it.t || sp) ? fmtMin(itemMin(it)) + " min" : ""].filter(Boolean).join(" – ");
        if(head) L.push("• " + head);
        (it.cal || []).forEach(function(c){
          L.push("• " + c[0] + ": " + (c[2] !== undefined ? c[1] : zonesPlain(c[1])));
          if(c[2]) L.push("   " + detailsText(c[2]));
        });
        (it.pts || []).forEach(function(p){
          const top = head ? "   - " : "• ", sub = head ? "      ◦ " : "   - ";
          if(Array.isArray(p)){ L.push(top + p[0]); (p[1] || []).forEach(function(q){ L.push(sub + q); }); }
          else L.push(top + p);
        });
      });
      if(x.k === "calendar") calsFor(e).forEach(function(c){ L.push("📅 " + c.label.replace(" (PDF)", "") + ": " + siteURL(c.file)); });
    });

      L.push("", "*Day " + (i + 1) + (g[0] ? " · " + dayName(g[0]) : "") + "*");
      g[1].forEach(function(r){ L.push("• " + [r[1], r[2]].filter(Boolean).join(" · ") + (r[3] ? " (" + r[3] + ")" : "")); });
    });

}
function showCopyBox(t){

function saveStop(del){
  const e = current(); if(!e || !STOP || SAVING) return;
  const f = $("stopf"), v = function(n){ const el = f && f.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ""; };
  const st = function(t, err){ const el = $("stopst"); if(el){ el.textContent = t; el.classList.toggle("err", !!err); } };
  const row = del ? null : [v("sdate"), v("stime"), v("swhat"), v("snote"), v("slink"), v("sdet")];
  if(row && !row[2]){ st("Give the stop a name.", true); return; }
  if(row && row[0] && !/^\d{4}-\d{2}-\d{2}$/.test(row[0])){ st("Pick a date.", true); return; }
  if(row && row[4] && !safeLink(row[4])){ st("The link must start with https://", true); return; }
  const key = STOP.i > -1 && e.days && e.days[STOP.i] ? stopKey(e.days[STOP.i]) : null, id = e.id;
  /* Applied to the newest copy of the event, so a save from another phone in between is kept. */
  const build = function(ev){
    const x = clone(ev); x.agenda = clone(sectionsOf(ev)); x.days = (x.days || []).map(function(r){ return r.slice(); });
    let i = key ? x.days.findIndex(function(r){ return stopKey(r) === key; }) : -1;
    if(del){ if(i > -1) x.days.splice(i, 1); }
    else if(i > -1) x.days[i] = row; else x.days.push(row);
    delete x.at; return x;
  };
  const go = function(tries){
    const ev = EVENTS.filter(function(x){ return x.id === id; })[0]; if(!ev){ st("This event was deleted on another device.", true); return; }
    const body = { events: {}, base: {} }; body.events[id] = build(ev); body.base[id] = ev.at || null;
    SAVING = true; st("Saving…");
    fetch(API, { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, AdminSession.headers()), body: JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function(x){
        SAVING = false;
        if(x.ok && Array.isArray(x.j.events)){ setData(x.j); STOP = null; render(); toast(del ? "Stop deleted." : "Saved. Everyone sees it within a minute."); return; }
        if(x.status === 401){ AdminSession.logout(); renderNav(); st("Your admin login expired. Sign in again, then tap Save.", true); AdminSession.login(function(){ renderNav(); }); return; }
        if(x.status === 409 && Array.isArray(x.j.events) && tries < 1){ setData({ savedAt: x.j.savedAt, events: x.j.events }); go(tries + 1); return; }
        st("Not saved: " + (x.j.error || "error " + x.status) + ". Your text is still here.", true);
      })
      .catch(function(){ SAVING = false; st("Not saved. Check the connection and tap Save again.", true); });
  };
  if(!admin()){ AdminSession.login(function(){ renderNav(); go(0); }); return; }
  go(0);
}

/* ---------------- editing ----------------
   Lists are typed as lines. Overview: "time | what". Roles: "role | person | note". Calendar:
   "date | what". Points: one per line; a line starting with "- " is a sub-point of the one above. */
function fmtRows(rows){ return (rows || []).map(function(r){ const a = r.slice(); while(a.length && !a[a.length - 1]) a.pop(); return a.join(" | "); }).join("\n"); }
function parseRows(text, n){
  return String(text || "").split("\n").map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    const p = l.split("|").map(function(x){ return x.trim(); });
    const out = p.slice(0, n - 1); out.push(p.slice(n - 1).join(" | "));
    while(out.length < n) out.push("");
    return out;
  });
}
function fmtPts(pts){ return (pts || []).map(function(p){ return Array.isArray(p) ? [p[0]].concat((p[1] || []).map(function(q){ return "- " + q; })).join("\n") : p; }).join("\n"); }
function parsePts(text){
  const out = [];
  String(text || "").split("\n").forEach(function(l){
    if(!l.trim()) return;
    const m = /^\s*[-–•]\s+(.*)$/.exec(l);
    if(m && out.length){
      let last = out[out.length - 1];
      if(!Array.isArray(last)){ last = [last, []]; out[out.length - 1] = last; }
      last[1].push(m[1].trim());
    } else out.push(l.replace(/^\s*[-–•]\s+/, "").trim());
  });
  return out;
}
function field(name, label, value, opts){

    : '<input name="' + name + '" type="' + (opts.type || "text") + '" value="' + esc(value == null ? "" : value) + '"' + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + (opts.attr || "") + '>';
  return '<label class="fl' + (opts.full ? ' full' : '') + '"><span>' + label + '</span>' + tag + (opts.hint ? '<p class="hint">' + opts.hint + '</p>' : '') + '</label>';
}

function collect(){
  const f = $("edf"); if(!f || !EDIT) return;
  const v = function(n, root){ const el = (root || f).querySelector('[name="' + n + '"]'); return el ? el.value : ""; };
  const d = EDIT.draft;
  ["title", "sub", "kind", "date", "time", "where", "whereNote", "zoom", "pass", "signup", "dress", "agendaTitle"].forEach(function(k){ d[k] = v(k).trim(); });
  d.flow = parseRows(v("flow"), 2);
  d.about = v("about").trim();
  /* The textarea has no room for a stop's details: keep each stop's details by its date and name. */
  const was = (d.days || []).slice();
  d.days = parseRows(v("days"), 5).map(function(r){
    const old = was.filter(function(o){ return o[0] === r[0] && o[2] === r[2]; })[0];
    const a = r.slice(); if(old && old[5]) { a[5] = old[5]; return a; }
    while(a.length > 3 && !a[a.length - 1]) a.pop(); return a;
  });
  d.faq = parseRows(v("faq"), 2);
  d.roles = STD_ROLES.map(function(r){ return [r[1], v("role_" + r[0]).trim()]; }).filter(function(r){ return r[1]; })
    .concat(parseRows(v("rolesx"), 2));
  d.agenda = Array.prototype.map.call(f.querySelectorAll(".sece"), function(se){
    return { k: se.dataset.k, items: Array.prototype.map.call(se.querySelectorAll(".iteme"), function(ie){
      const it = {};
      const t = v("t", ie).trim(), who = v("who", ie).trim(), by = v("by", ie).trim(), min = parseInt(v("min", ie), 10);
      if(t) it.t = t;
      if(who) it.who = who;
      if(by) it.by = by;
      if(min > 0) it.min = min;
      const pts = parsePts(v("pts", ie)); if(pts.length) it.pts = pts;
      const cal = parseRows(v("cal", ie), 3).map(function(r){ return r[2] ? r : r.slice(0, 2); }); if(cal.length) it.cal = cal;
      return it;
    }) };
  });
}
function edStatus(t, err){ const el = $("edst"); if(el){ el.textContent = t; el.classList.toggle("err", !!err); } }
/* The next free date on that weekday (5 Friday, 6 Saturday), today included. */
function nextDay(dow){
  const t = asDate(todayET());
  t.setDate(t.getDate() + (dow - t.getDay() + 7) % 7);
  while(EVENTS.some(function(e){ return e.date === ymd(t); })) t.setDate(t.getDate() + 7);
  return ymd(t);
}

function startEdit(){

  const draft = clone(e); draft.agenda = clone(sectionsOf(e));
  EDIT = { id: e.id, isNew: false, base: e.at || null, draft: draft };
  DIRTY = false; CONFLICT = null; render(); scrollTo(0, 0);

function save(){
  collect();
  const d = EDIT.draft;
  if(!d.title){ edStatus("Give the event a title.", true); markBad("title"); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)){ edStatus("Pick the date.", true); markBad("date"); return; }
  let id = EDIT.id;
  if(EDIT.isNew){ id = d.date; let n = 2; while(EVENTS.some(function(e){ return e.id === id; })) id = d.date + "-" + n++; }
  const ev = clone(d); ev.id = id; delete ev.at;
  const body = { events: {}, base: {} }; body.events[id] = ev; body.base[id] = EDIT.isNew ? null : EDIT.base;
  send(body, function(){
    EDIT = null; DIRTY = false; CONFLICT = null;
    history.replaceState(null, "", "#" + id + "/manage"); render(); scrollTo(0, 0);
    toast("Saved. Everyone sees it on their next refresh, within a minute.");
  });
}
function markBad(n){ const el = document.querySelector('#edf [name="' + n + '"]'); if(el){ el.classList.add("bad"); el.focus(); } }
function deleteEvent(){
  const body = { events: {}, base: {} }; body.events[EDIT.id] = { deleted: true }; body.base[EDIT.id] = EDIT.base;
  send(body, function(){
    EDIT = null; DIRTY = false; CONFLICT = null;
    history.replaceState(null, "", location.pathname); render(); scrollTo(0, 0);
    toast("Event deleted.");
  });
}
function send(body, onOk){
  if(SAVING) return;
  if(!admin()){ AdminSession.login(function(){ renderNav(); send(body, onOk); }); return; }
  SAVING = true; CONFLICT = null; edStatus("Saving…");
  document.querySelectorAll('.edbar .btn').forEach(function(b){ b.disabled = true; });
  const done = function(){ SAVING = false; document.querySelectorAll('.edbar .btn').forEach(function(b){ b.disabled = false; }); };
  fetch(API, { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, AdminSession.headers()), body: JSON.stringify(body) })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok: r.ok, status: r.status, j: j }; }); })
    .then(function(x){
      done();
      if(x.ok && Array.isArray(x.j.events)){ setData(x.j); onOk(); return; }
      if(x.status === 401){
        AdminSession.logout(); renderNav();
        edStatus("Your admin login has expired. Sign in again and it saves.", true);
        AdminSession.login(function(){ renderNav(); send(body, onOk); });
        return;
      }
      if(x.status === 409 && Array.isArray(x.j.events)){
        setData({ savedAt: x.j.savedAt, events: x.j.events }); renderNav();
        CONFLICT = { msg: x.j.error || "This event changed on another device." }; showConflict(); return;
      }
      edStatus("Not saved: " + (x.j.error || "error " + x.status) + ". Your changes are still here.", true);
    })
    .catch(function(){ done(); edStatus("Not saved. Check the connection and tap Save again. Your changes are still here.", true); });
}
function showConflict(){
  const el = $("edst"); if(!el) return;
  el.classList.add("err");
  el.innerHTML = esc(CONFLICT.msg) + ' Not saved. Your version is still here.<br>'
    + '<button type="button" class="btn sm pri" data-act="mine">Save mine over it</button>'
    + (EDIT.isNew ? '' : '<button type="button" class="btn sm" data-act="theirs">Load the newer one</button>');
}
function keepMine(){
  collect();
  const id = EDIT.id, cur = EVENTS.filter(function(e){ return e.id === id; })[0];
  if(EDIT.isNew){ /* the date is taken: save() picks the next free id */ }
  else if(cur) EDIT.base = cur.at || null;
  else { EDIT.isNew = true; EDIT.base = null; }       /* deleted elsewhere: save it back as new */
  CONFLICT = null; save();
}
function loadTheirs(){
  const cur = EVENTS.filter(function(e){ return e.id === EDIT.id; })[0];
  if(!cur){ stopEdit(); toast("That event was deleted on another device."); return; }
  const draft = clone(cur); draft.agenda = clone(sectionsOf(cur));
  EDIT = { id: cur.id, isNew: false, base: cur.at || null, draft: draft }; DIRTY = false; CONFLICT = null; render();
}
function arm(btn, label, fn){
  if(btn.dataset.armed){ fn(); return; }
  const was = btn.textContent; btn.dataset.armed = "1"; btn.classList.add("armed"); btn.textContent = label;
  setTimeout(function(){ if(btn.isConnected){ delete btn.dataset.armed; btn.classList.remove("armed"); btn.textContent = was; } }, 3500);
}

/* ---------------- clicks ---------------- */
/* "Manage →" on an event card sits inside the card's link, so it goes to the manage view instead. */
document.addEventListener("click", function(ev){
  const g = ev.target.closest("[data-go]"); if(!g) return;
  ev.preventDefault(); ev.stopImmediatePropagation();
  if(EDIT){ toast("Save or cancel your edit first."); return; }
  CHOOSING = false; location.hash = g.dataset.go.slice(1);
}, true);
/* Links to the list ("Team Event", "All events", "← All events") and to an event. While an edit is
   open they wait for Save or Cancel; from the New event chooser they leave it. A link to the page
   already showing just redraws it (no hashchange fires). */
document.addEventListener("click", function(ev){
  const a = ev.target.closest('a[href^="#"]'); if(!a) return;
  if(EDIT){ ev.preventDefault(); toast("Save or cancel your edit first."); return; }
  const same = (a.getAttribute("href") === "#" ? "" : a.getAttribute("href").slice(1)) === wantedId();
  if(CHOOSING || same){ CHOOSING = false; if(same){ ev.preventDefault(); if(!wantedId()) history.replaceState(null, "", location.pathname + location.search); render(); scrollTo({ top: 0 }); } }
});
$("dots").addEventListener("click", function(){
  if(admin()){ toast("Signed in as admin. Use Edit on an event, or + New event."); return; }
  AdminSession.login(function(){ render(); toast("Signed in. Tap Edit on any event, or + New event."); });
});
document.addEventListener("click", function(ev){
  const c = ev.target.closest("[data-copy]");
  if(c){
    const v = c.dataset.copy.replace(/\D/g, "");
    const ok = function(){ toast("Zoom ID copied"); }, no = function(){ toast("Zoom ID: " + c.dataset.copy); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(ok, no); else no();
    return;
  }
  const fl = ev.target.closest("[data-flyer]");
  if(fl){ showFlyer(fl.dataset.flyer); return; }
  const b = ev.target.closest("[data-act]"); if(!b || b.disabled) return;
  const act = b.dataset.act;
  if(act === "retry"){ LOAD_FAILED = false; render(); loadData(); return; }
  if(act === "copy"){ copyAgenda(); return; }
  if(act === "copylink"){ copyLink(); return; }
  if(act === "dress"){ showDress(); return; }
  if(act === "new"){ startNew(); return; }
  if(act === "night"){ startFrom(b.dataset.night); return; }
  if(act === "unchoose"){ CHOOSING = false; render(); return; }
  if(act === "edit"){ if(STOP){ toast("Save or cancel the stop you are editing first."); return; } startEdit(); return; }
  if(act === "stopedit" || act === "stopadd"){
    if(STOP){ toast("Save or cancel the stop you are editing first."); return; }
    const e = current(); if(!e) return;
    STOP = { id: e.id, i: act === "stopadd" ? -1 : +b.dataset.i }; render();
    const f = $("stopf"); if(f){ f.scrollIntoView({ block: "center" }); const w = f.querySelector('[name="' + (act === "stopadd" ? "swhat" : "sdet") + '"]'); if(w) w.focus({ preventScroll: true }); }
    return;
  }
  if(act === "stopcancel"){ if(STOP && STOP.i > -1) OPEN[STOP.id + ":" + STOP.i] = 1; STOP = null; render(); return; }
  if(act === "stopsave"){ saveStop(false); return; }
  if(act === "stopdel"){ arm(b, "Tap again to delete", function(){ saveStop(true); }); return; }
  if(act === "signout"){
    if(EDIT && DIRTY){ toast("Save or cancel your edit first."); return; }
    AdminSession.logout(); EDIT = null; render(); toast("Signed out of admin."); return;
  }
  if(!EDIT) return;
  if(act === "save"){ save(); return; }
  if(act === "cancel"){ if(DIRTY) arm(b, "Discard changes?", stopEdit); else stopEdit(); return; }
  if(act === "delevent"){ arm(b, "Tap again to delete", deleteEvent); return; }
  if(act === "mine"){ keepMine(); return; }
  if(act === "theirs"){ loadTheirs(); return; }
  /* collect() rebuilds the agenda from the form, so read the agenda after it, never before. */
  const se = b.closest(".sece");
  if(act === "addsec"){
    collect(); const k = b.dataset.k, ag = EDIT.draft.agenda;
    let at = ag.length; while(at > 0 && SEC[ag[at - 1].k].i > SEC[k].i) at--;   /* its usual place */
    ag.splice(at, 0, { k: k, items: [SEC[k].add[0][1]()] }); DIRTY = true; renderEditor();
    const n = document.querySelector('.sece[data-si="' + at + '"]'); if(n) n.scrollIntoView({ block: "center" });
    return;
  }
  if(!se) return;
  const si = +se.dataset.si;
  if(act === "additem"){
    collect(); const items = EDIT.draft.agenda[si].items;
    items.push(SEC[EDIT.draft.agenda[si].k].add[+b.dataset.ai][1]()); DIRTY = true; renderEditor();
    const all = document.querySelectorAll('.sece[data-si="' + si + '"] .iteme'), last = all[all.length - 1];
    if(last){ last.scrollIntoView({ block: "center" }); last.querySelector('[name="' + (last.querySelector('[name="t"]').value ? "who" : "t") + '"]').focus(); }
    return;
  }
  if(act === "secup" || act === "secdown"){
    collect(); const ag = EDIT.draft.agenda, j = act === "secup" ? si - 1 : si + 1; if(j < 0 || j >= ag.length) return;
    const tmp = ag[si]; ag[si] = ag[j]; ag[j] = tmp; DIRTY = true; renderEditor(); return;
  }
  if(act === "secdel"){ arm(b, "Tap again", function(){ collect(); EDIT.draft.agenda.splice(si, 1); DIRTY = true; renderEditor(); }); return; }
  const ie = b.closest(".iteme"); if(!ie) return;
  const ii = +ie.dataset.ii;
  if(act === "itemup" || act === "itemdown"){
    collect(); const items = EDIT.draft.agenda[si].items, j = act === "itemup" ? ii - 1 : ii + 1; if(j < 0 || j >= items.length) return;
    const tmp = items[ii]; items[ii] = items[j]; items[j] = tmp; DIRTY = true; renderEditor(); return;
  }
  if(act === "itemdel"){ arm(b, "Tap again", function(){ collect(); EDIT.draft.agenda[si].items.splice(ii, 1); DIRTY = true; renderEditor(); }); }
});
$("doc").addEventListener("input", function(ev){
  if(!EDIT) return;
  DIRTY = true; ev.target.classList && ev.target.classList.remove("bad");
  if(ev.target.name === "title"){ const h = document.querySelector("#doc h1"); if(h) h.textContent = ev.target.value || "Untitled event"; }
});
addEventListener("beforeunload", function(ev){ if((EDIT && DIRTY) || STOP){ ev.preventDefault(); ev.returnValue = ""; } });
addEventListener("hashchange", function(){ if(!EDIT){ STOP = null; render(); scrollTo({ top: 0 }); } });

render();
loadData();
loadFlyers();
setInterval(function(){ if(!document.hidden) loadData(); }, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) loadData(); });

/* ---------- always the newest version ----------
   GitHub Pages lets a browser reuse its saved copy for ten minutes, and a tab that stays open
   never asks again, so a phone opened before the last change would keep old code. The page asks
   the server for its own newest copy, past every cache: on load, when the tab comes back into
   view, and once a minute. If the script there differs from the one running, it reloads onto
   it, keeping the event you were on. Never while an edit is open: it waits for Save or Cancel. */
function paintVer(){
  const when = function(t){ return new Date(t).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); };
  const txt = "Version " + when(BUILD) + (stale ? " · a newer version is out, reloading"
    : checkedAt ? " · the newest (checked " + new Date(checkedAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + ")" : "");
  document.querySelectorAll(".ver").forEach(function(el){ el.textContent = txt; el.classList.toggle("old", stale); });
}
function freshen(){
  if(!/^https?:$/.test(location.protocol) || document.hidden || Date.now() - triedAt < 8000) return;
  triedAt = Date.now();
  fetch(location.pathname + "?latest=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(html){
      const m = /const BUILD = "([^"]+)";/.exec(html);
      if(!m || !SELF) return;                  /* not this page: a wifi sign-in screen, an error */
      checkedAt = Date.now();
      /* Behind only when the server's copy is not older and its script differs. Right after a
         push one edge server can lag, and that must not pull anyone back. */
      stale = m[1] >= BUILD && html.indexOf(SELF) < 0;
      staleKey = m[1] + ":" + html.length;
      paintVer(); reloadWhenSafe();
    }).catch(function(){});
}
function reloadWhenSafe(){
  if(!stale){ $("upd").hidden = true; return; }
  let tried = ""; try{ tried = sessionStorage.getItem("team-event-tried") || ""; }catch(e){}
  /* One automatic reload per new version, so a bad edge server can never cause a loop. */
  if(tried !== staleKey && !EDIT && !STOP){ reloadNow(); return; }
  $("updt").textContent = EDIT ? "A newer version is out. It loads after you save or cancel." : "A newer version of this page is out.";
  $("upd").hidden = false;
}
function reloadNow(){
  try{ sessionStorage.setItem("team-event-tried", staleKey); }catch(e){}
  location.replace(location.pathname + "?v=" + Date.now() + location.hash);
}
$("updgo").onclick = function(){ if(EDIT && DIRTY){ toast("Save or cancel your edit first."); return; } reloadNow(); };
paintVer(); freshen();
setInterval(freshen, 60000);
setInterval(function(){ if(stale) reloadWhenSafe(); }, 3000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) freshen(); });
addEventListener("focus", freshen);
addEventListener("pageshow", function(e){ if(e.persisted){ triedAt = 0; freshen(); } });
</script>
